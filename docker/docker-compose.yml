version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: elevate-workforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: elevate_workforce
      POSTGRES_USER: ews
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ews -d elevate_workforce"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
